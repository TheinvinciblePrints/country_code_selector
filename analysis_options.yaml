include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - example/build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    - always_specify_types
    - prefer_single_quotes
    - prefer_relative_imports
    - prefer_final_locals
    - directives_ordering
    - public_member_api_docs

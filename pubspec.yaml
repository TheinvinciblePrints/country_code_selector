name: country_code_selector
description: >-
  Country code picker with searchable dialog, bottom sheet, Cupertino wheel, dropdown and phone field button. Flags, dial codes and country names in 202 languages.
version: 0.1.1
repository: https://github.com/TheinvinciblePrints/country_code_selector
issue_tracker: https://github.com/TheinvinciblePrints/country_code_selector/issues
topics:
  - country-picker
  - phone
  - flags
  - localization
  - picker

screenshots:
  - description: Searchable country dialog with favourites.
    path: doc/screenshots/dialog.png
  - description: Bottom sheet with round flags.
    path: doc/screenshots/bottom_sheet.png
  - description: Cupertino wheel picker.
    path: doc/screenshots/cupertino.png
  - description: Phone number field with CountryCodeSelectorWidget and validation.
    path: doc/screenshots/phone_field.png
  - description: Custom bottom sheet built with customBuilder.
    path: doc/screenshots/custom_builder.png

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  dlibphonenumber: ^1.1.73
  flutter:
    sdk: flutter
  flutter_svg: ^2.1.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_lints: ">=5.0.0 <7.0.0"
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/flags/
    - assets/i18n/
